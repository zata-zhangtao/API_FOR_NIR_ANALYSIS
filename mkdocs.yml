site_name: NIR API Documentation
site_description: A Near-Infrared Spectroscopy Analysis API
site_author: zata
site_url: https://github.com/zata/nirapi

# Repository
repo_name: zata/nirapi
repo_url: https://github.com/zata/nirapi
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 zata

# Configuration
theme:
  name: material
  language: zh
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

# Plugins
plugins:
  - search:
      lang:
        - en
        - zh

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# Page tree
nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - API 参考:
    - 概览: api/overview.md
    - 自动机器学习: api/automl.md
    - 数据加载: api/load_data.md
    - 数据预处理: api/preprocessing.md
    - 机器学习模型: api/ml_model.md
    - 数据可视化: api/draw.md
    - 数据分析: api/analysis.md
    - 工具函数: api/utils.md
    - 分析类: api/analysis_class.md
  - 教程:
    - 基础使用: tutorials/basic-usage.md
    - 光谱重建: tutorials/spectrum-reconstruction.md
    - 机器学习建模: tutorials/machine-learning.md
    - 数据可视化: tutorials/visualization.md
  - 示例:
    - 完整工作流程: examples/complete-workflow.md
    - 光谱分析: examples/spectral-analysis.md
    - 模型评估: examples/model-evaluation.md
  - 开发指南:
    - 贡献指南: development/contributing.md
    - 代码规范: development/code-style.md
  - 更新日志: changelog.md
